run_name: OLMo-150M-try
seed: 479
dry_run: false

wandb:
  project: token_scaling
  entity: siva-reddy-mila-org
  log_interval: 10

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 8
  weight_tying: false
  alibi: false
  rope: true
  flash_attention: true
  attention_dropout: 0.0
  attention_layer_norm: false
  clip_qkv: null
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: false
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2024
  vocab_size: 50280
  embedding_size: 50304
  eos_token_id: 0
  pad_token_id: 1
  # vocab_size: 100278 # OLMo-2 tokenizer
  # embedding_size: 100352 # OLMo-2 tokenizer
  # eos_token_id: 100257 # OLMo-2 tokenizer
  # pad_token_id: 100277 # OLMo-2 tokenizer
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

ddp:
  grad_sync_mode: batch
  find_unused_params: false

compile: null

optimizer:
  name: adamw
  learning_rate: 4.2e-3
  weight_decay: 0.1
  eps: 1e-8
  decay_norm_and_bias: true
  decay_embeddings: true
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  units: steps
  t_warmup: 1907
  alpha_f: 0.1
  warmup_min_lr: 0

tokenizer:
  identifier: /work/OLMo/olmo_data/tokenizers/allenai_gpt-neox-olmo-dolma-v1_5.json
  # identifier: /work/OLMo/olmo_data/tokenizers/allenai_dolma2.json # OLMo-2 tokenizer
  truncate_direction: right

save_folder: /work/scratch/olmo/checkpoints/
save_overwrite: false
try_load_latest_save: false # this will search of the latest checkpoint in ${save_folder} if true
load_path: null # use this to start from a pre-trained checkpoint

# Unsharded checkpoints (for ddp)
save_interval: 500 # save interval for sharded checkpoints
save_interval_unsharded: 500 # save interval for unsharded checkpoints
save_num_checkpoints_to_keep: 3 # number of sharded checkpoints to keep
save_num_unsharded_checkpoints_to_keep: 3 # number of unsharded checkpoints to keep

global_train_batch_size: 192
device_train_microbatch_size: 16
max_duration: 38157

precision: amp_bf16
distributed_strategy: ddp

gen1_gc_interval: 1

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20

eval_interval: 500
eval_subset_num_batches: 350
device_eval_batch_size: ${device_train_microbatch_size}
evaluators:
  ##########################
  #    LMing evaluations   #
  ##########################
  - label: ppl-validation
    data:
      num_workers: 8
      drop_last: true
      # generate_doc_lengths: true
      # memmap_dtype: uint32 # when using OLMo-2 tokenizer
      datasets:
          dolma-c4-validation:
            - /work/scratch/dolma_1_6_c4_validation/part-01-00000.npy

data:
  seed: 0 # seed used for shuffling the data
  pad_direction: right
  num_workers: 8
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  # memmap_dtype: uint16 # when using the OLMo-1 tokenizer
  # memmap_dtype: uint32 # when using the OLMo-2 tokenizer
  # instance_filter:
  #   repetition_max_period: 13
  #   repetition_min_period: 1
  #   repetition_max_count: 32
  paths:
    # Dolma encoded version of DKYoon/SlimPajama-6B (5.4B tokens)
    - /work/scratch/dolma_1_6_c4_training/part-00-00000.npy
    - /work/scratch/dolma_1_6_c4_training/part-02-00000.npy
