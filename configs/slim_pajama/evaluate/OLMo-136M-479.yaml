seed: 479

tokenizer:
  identifier: /home/mila/a/arkil.patel/OLMo/olmo_data/tokenizers/allenai_dolma2.json # OLMo-2 tokenizer
  truncate_direction: right

load_path: /network/scratch/a/arkil.patel/olmo/checkpoints/OLMo_136M_479-1d44da470ff5b142/latest-unsharded
save_folder: ${load_path}

global_eval_batch_size: 50
device_eval_microbatch_size: 50

precision: amp_bf16
distributed_strategy: ddp
init_device: cuda

ddp:
  grad_sync_mode: batch
  find_unused_params: false

console_log_interval: 10

device_eval_batch_size: ${device_eval_microbatch_size}
eval_subset_num_batches: -1
evaluators:
  - label: ppl-validation
    data:
      num_workers: 6
      drop_last: true
      # generate_doc_lengths: true
      memmap_dtype: uint32
      datasets:
          slim-pajama-validation:
            - /network/scratch/m/marius.mosbach/olmo/validation_data/olmo2/slim_pajama/dolma/part-0-00000.npy # 8.85M tokens

